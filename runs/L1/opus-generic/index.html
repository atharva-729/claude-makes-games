<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pip's Leap - a 2D platformer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0c0a14; overflow: hidden; }
  canvas { display: block; outline: none; }
  #dbg { position: fixed; left: 4px; bottom: 4px; color: #7f7; font: 12px monospace; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="dbg"></div>
<noscript style="color:#fff;font-family:sans-serif">This game needs JavaScript.</noscript>
<script src="game.js"></script>
</body>
</html>
